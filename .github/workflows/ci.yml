name: CI

on: [push, workflow_dispatch]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -v

  publicar:
    needs: pruebas
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Completar la página con el commit y la fecha
        env:
          MENSAJE: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p _site && cp -r site/. _site/
          FECHA=$(TZ=America/Lima date '+%d/%m/%Y %H:%M')
          MSG=$(printf '%s' "$MENSAJE" | head -1 | sed 's/[&/\]/\&/g')
          sed -i -e "s/{{RESULTADO}}/Aprobadas/" -e "s/{{COMMIT}}/${GITHUB_SHA::7}/" \
                 -e "s/{{MENSAJE}}/${MSG}/" -e "s|{{FECHA}}|${FECHA}|" \
                 -e "s|{{RUN_URL}}|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
